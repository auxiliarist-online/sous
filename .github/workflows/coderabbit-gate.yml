# A PR is finished only when CodeRabbit approves its latest commit.
#
# With request_changes_workflow on (.coderabbit.yaml), CodeRabbit requests
# changes when it has findings and approves once they're resolved and the
# latest commit is reviewed. "CodeRabbit approved" passes on that approval of
# the PR's current head, so every push needs a fresh review. When CodeRabbit
# re-reviews a push and finds nothing new, it doesn't approve again: it only
# marks the commit "Review completed". That passes too, if its last verdict was
# an approval and it left no review on the new commit.
#
# Sous has under 10 stars, so CodeRabbit doesn't review on its own: comment
# "@coderabbitai review" (or tick "Trigger review" in its comment) after each
# push. It ignores that command from bots, so this workflow can't ask for you.
# Its free plan allows about one review an hour.
name: CodeRabbit gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: coderabbit-gate-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  approved:
    name: CodeRabbit approved
    # Only the push-time run is the check. A review re-runs it (below) rather
    # than adding a second "CodeRabbit approved" run: GitHub counts every run of
    # a required check on the commit, so an old failing one would still block.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          # CodeRabbit's latest approval or change request, and the commit it was on.
          latest=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "coderabbitai[bot]")
                      | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")
                      | "\(.state) \(.commit_id)"' | tail -n 1)
          state=${latest%% *}
          commit=${latest##* }
          echo "Head: $head"
          echo "CodeRabbit: ${latest:-no approval or change request yet}"
          if [ "$state" = "APPROVED" ] && [ "$commit" = "$head" ]; then
            echo "CodeRabbit approved this commit."
            exit 0
          fi
          if [ "$state" = "APPROVED" ]; then
            # Approved earlier: pass if CodeRabbit finished reviewing this commit
            # and left no review on it (findings come as a review).
            # Only CodeRabbit's own status counts (anyone who can post statuses
            # could name one "CodeRabbit"), and only its latest, newest first.
            done=$(gh api "repos/$REPO/commits/$head/statuses?per_page=100" \
              --jq '[.[] | select(.context == "CodeRabbit" and .creator.login == "coderabbitai[bot]")]
                    | first // {} | select(.state == "success" and .description == "Review completed")
                    | 1' | wc -l | tr -d ' ')
            left=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq ".[] | select(.user.login == \"coderabbitai[bot]\")
                        | select(.commit_id == \"$head\") | .state" | wc -l | tr -d ' ')
            echo "Review of this commit completed: $done; reviews left on it: $left"
            if [ "$done" -gt 0 ] && [ "$left" -eq 0 ]; then
              echo "CodeRabbit approved an earlier commit and found nothing new in this one."
              exit 0
            fi
          fi
          if [ "$state" = "CHANGES_REQUESTED" ]; then
            echo "::error::CodeRabbit requested changes. Fix or resolve its comments, then push."
          else
            echo "::error::Waiting for CodeRabbit to approve $head."
          fi
          exit 1

  review-received:
    name: Review received
    # Starts coderabbit-recheck.yml (workflow_run), which re-runs the push-time
    # check with a write token. This job can't: for a fork's pull request a
    # review event only gets a read-only token.
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "Review on $HEAD; coderabbit-recheck.yml re-runs the gate."
