# Uptime check (TYL-74): every 30 minutes, the web app and the API's health
# check must answer. A failed run is emailed by GitHub to whoever last changed
# this schedule (Settings → Notifications → Actions, "failed workflows only").
name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Web app
        run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --max-time 20 -o /dev/null https://sous-tawny.vercel.app/
      - name: API health
        run: |
          body=$(curl --fail --silent --show-error --retry 2 --retry-delay 20 --max-time 20 https://sous-tawny.vercel.app/api/health)
          echo "$body"
          [ "$body" = '{"status":"ok"}' ]
