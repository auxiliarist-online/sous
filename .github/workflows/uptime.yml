# Uptime check (TYL-74): every 30 minutes, the web app, the API's health
# check and Supabase must answer. The Supabase read also keeps the free-tier
# project from being paused for inactivity (it pauses after 7 idle days).
# A failed run is emailed by GitHub to whoever last changed this schedule (Settings → Notifications → Actions, "failed workflows only").
name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Web app
        run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --max-time 20 -o /dev/null https://sous-tawny.vercel.app/
      - name: API health
        run: |
          body=$(curl --fail --silent --show-error --retry 2 --retry-delay 20 --max-time 20 https://sous-tawny.vercel.app/api/health)
          echo "$body"
          [ "$body" = '{"status":"ok"}' ]
      - name: Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 20 --max-time 20 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/recipes?select=id&limit=1"
