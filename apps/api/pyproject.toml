[project]
name = "sous-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pydantic-settings>=2.6",
    "recipe-scrapers>=15.12,<16",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-defusedxml",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "unit: fast tests with no network or database (tests/unit)",
    "integration: need Postgres at SOUS_TEST_DATABASE_URL (tests/integration)",
    "live: fetch real websites; run with --live (tests/live)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
