<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- The colour behind the phone's status and navigation bars, which Sous
         draws under: Android picks dark or light bar icons from it. It must
         match the page (off-white, or the dark background), or the buttons
         come out white on white (TYL-93). -->
    <meta
      name="theme-color"
      content="#faf8f4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141110"
      media="(prefers-color-scheme: dark)"
    />
    <title>Sous</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
